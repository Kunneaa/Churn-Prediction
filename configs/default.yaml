# Tham số thí nghiệm (DS-05): `uv run churn --config configs/default.yaml`
# Notebook notebooks/01-churn-pipeline.ipynb đọc cùng file này.
seed: 42
test_size: 0.2          # tập test giữ riêng, chỉ dùng một lần ở bước đánh giá cuối
cv: 3                   # stratified k-fold trên tập train cho mọi thí nghiệm so sánh
cv_repeats: 3           # kiểm định thống kê: CV 3-fold lặp 3 lần + t-test hiệu chỉnh Nadeau–Bengio
# Thí nghiệm so sánh (3.1–3.5, MLP) chạy CV trên mẫu con phân tầng của train để notebook vừa thời gian
# Colab; mô hình cuối vẫn fit trên TOÀN BỘ train và đo trên TOÀN BỘ test. null = dùng toàn bộ train.
stage_sample: 30000
threshold_cv: 3         # số fold out-of-fold để chọn ngưỡng trên train (balanced accuracy; F1 để so sánh)
threshold_sample: 30000 # mẫu con train dùng chọn ngưỡng; đo: lệch ≤ 0.02 so với toàn bộ train (null = toàn bộ)
importance_sample: 5000 # số dòng test dùng cho permutation importance

tuning:
  # RandomizedSearchCV trên mẫu con phân tầng của train: giữ thời gian chạy notebook hợp lý trên Colab
  sample: 20000
  cv: 3
  n_iter:
    logreg: 5
    random_forest: 5
    hist_gb: 5
  # LightGBM: tham số mặc định chọn bằng CV OOF trên 80k train (ADR-0005); lần tuning 2026-11-22 ra gần
  # đúng mặc định (1500 cây, lr 0.02, 31 lá) nhưng tốn ~10 phút -> chỉ đánh giá, không tuning.
  fixed: [lightgbm]
  spaces:
    logreg:
      model__C: [0.001, 0.01, 0.1, 1, 10]
    random_forest:
      model__n_estimators: [150, 300]
      model__max_depth: [10, 14, 20]
      model__min_samples_leaf: [5, 10, 20, 50]
      model__max_features: ["sqrt", 0.3, 0.5]
    hist_gb:
      model__learning_rate: [0.03, 0.05, 0.1]
      model__max_leaf_nodes: [15, 31, 63]
      model__min_samples_leaf: [20, 50, 100]
      model__l2_regularization: [0.0, 1.0, 5.0]

# Mở rộng (deep learning cho dữ liệu bảng): kiến trúc MLP so sánh bằng CV
mlp:
  - {hidden_layer_sizes: [64], alpha: 0.001}
  - {hidden_layer_sizes: [128, 64], alpha: 0.001}
  - {hidden_layer_sizes: [128, 64], alpha: 0.01}
  - {hidden_layer_sizes: [256, 128, 64], alpha: 0.01}
  # MLP PyTorch: BatchNorm + dropout, AdamW, dừng sớm theo loss validation (torch có sẵn trên Colab)
  - {model: torch_mlp, hidden_layer_sizes: [128, 64], dropout: 0.2}
  - {model: torch_mlp, hidden_layer_sizes: [256, 128], dropout: 0.3}
